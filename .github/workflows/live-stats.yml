name: live-stats
# DISABLED as a schedule: GitHub Free, no Actions minutes. The snapshot + badges are pushed
# every 30 min by a systemd timer on the VPS (live-stats-push, repo-scoped deploy key).
# Kept for a manual run only.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch live stats from the VPS (public, sanitized endpoint)
        run: curl -fsS --max-time 30 https://api.adaptivesystems.dev/public/stats -o docs/live-stats.json

      - name: render badges
        run: python3 scripts/render_badge.py

      - name: commit if changed
        run: |
          git config user.name "live-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live-stats.json docs/badge-*.json
          git diff --cached --quiet || git commit -m "live stats refresh [skip ci]"
          git push
